name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Temporary GitHub Release tag
        required: true
        type: string

      asset_name:
        description: ZIP asset name
        required: true
        type: string

      build_type:
        description: Build type
        required: true
        type: choice
        options:
          - auto
          - flutter
        default: auto

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"

      - name: Download ZIP from GitHub Release
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ inputs.release_tag }}"
          ASSET="${{ inputs.asset_name }}"

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --clobber

          if [ ! -f "$ASSET" ]; then
            echo "::error::Gagal download asset '$ASSET' dari release '$TAG'"
            exit 1
          fi

          echo "zip_path=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          set -euo pipefail

          mkdir -p workspace

          ZIP="${{ steps.download.outputs.zip_path }}"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP tidak ditemukan: $ZIP"
            exit 1
          fi

          unzip -q "$ZIP" -d workspace

          echo "Isi ZIP:"
          find workspace -maxdepth 4 -type f | sort | head -300

      - name: Detect Flutter project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ inputs.build_type }}"

          if [ "$REQUESTED" = "flutter" ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if find workspace \
            -type f \
            -name "pubspec.yaml" \
            -print -quit | grep -q .; then

            echo "type=flutter" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "type=unknown" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find workspace \
            -type f \
            -name pubspec.yaml \
            -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "FLUTTER_PROJECT=$ROOT" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$ROOT"

      - name: Configure Gradle 8.14.2 all.zip
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "::error::gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          echo "Gradle wrapper sebelum:"
          grep "distributionUrl" "$WRAPPER" || true

          sed -i -E \
            's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.2-all.zip#' \
            "$WRAPPER"

          echo "Gradle wrapper sesudah:"
          grep "distributionUrl" "$WRAPPER"

          if ! grep -q "gradle-8.14.2-all.zip" "$WRAPPER"; then
            echo "::error::Gradle wrapper bukan 8.14.2-all.zip"
            exit 1
          fi

      - name: Configure AGP 8.12.1
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          MIN_AGP="8.12.1"

          for FILE in \
            android/settings.gradle \
            android/settings.gradle.kts \
            android/build.gradle \
            android/build.gradle.kts
          do
            if [ -f "$FILE" ]; then
              echo "Checking AGP in $FILE"

              sed -i -E \
                "s#(id\\(?[\"']com\\.android\\.application[\"']\\)?[[:space:]]+version[[:space:]]+[\"'])[0-9.]+([\"'])#\\1${MIN_AGP}\\2#g" \
                "$FILE"

              sed -i -E \
                "s#(classpath[[:space:]]+[\"']com\\.android\\.tools\\.build:gradle:)[0-9.]+([\"'])#\\1${MIN_AGP}\\2#g" \
                "$FILE"
            fi
          done

          echo "AGP configuration:"
          grep -Rni \
            "com.android.application\|com.android.tools.build:gradle" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Configure Kotlin 2.2.20
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          MIN_KOTLIN="2.2.20"

          for FILE in \
            android/settings.gradle \
            android/settings.gradle.kts \
            android/build.gradle \
            android/build.gradle.kts
          do
            if [ -f "$FILE" ]; then
              echo "Checking Kotlin in $FILE"

              # plugins:
              # id("org.jetbrains.kotlin.android") version "x.x.x"
              sed -i -E \
                "s#(id\\(?[\"']org\\.jetbrains\\.kotlin\\.android[\"']\\)?[[:space:]]+version[[:space:]]+[\"'])[0-9.]+([\"'])#\\1${MIN_KOTLIN}\\2#g" \
                "$FILE"

              # Legacy ext.kotlin_version
              sed -i -E \
                "s#(ext\\.kotlin_version[[:space:]]*=[[:space:]]*[\"'])[0-9.]+([\"'])#\\1${MIN_KOTLIN}\\2#g" \
                "$FILE"

              # Legacy kotlin-gradle-plugin
              sed -i -E \
                "s#(classpath[[:space:]]+[\"']org\\.jetbrains\\.kotlin:kotlin-gradle-plugin:)[0-9.]+([\"'])#\\1${MIN_KOTLIN}\\2#g" \
                "$FILE"
            fi
          done

          echo "Kotlin configuration:"
          grep -Rni \
            "org.jetbrains.kotlin.android\|kotlin_version\|kotlin-gradle-plugin" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Flutter dependencies
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release

      - name: Collect Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          APK="$(
            find "$FLUTTER_PROJECT/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK Flutter tidak ditemukan."
            find "$FLUTTER_PROJECT/build" \
              -type f \
              -name "*.apk" \
              -print \
              || true
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp "$APK" output/app-release.apk

          echo "Output:"
          ls -lh output/app-release.apk

      - name: Unsupported project
        if: steps.detect.outputs.type == 'unknown'
        shell: bash
        run: |
          echo "::error::ZIP tidak berisi project Flutter."
          exit 1

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ inputs.release_tag }}
          path: output/app-release.apk
          if-no-files-found: error
          retention-days: 1
