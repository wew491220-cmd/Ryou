name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Temporary GitHub Release tag containing the source ZIP
        required: true
        type: string
      asset_name:
        description: GitHub Release asset name containing the source ZIP
        required: true
        type: string
      build_type:
        description: Build mode
        required: true
        type: choice
        options:
          - auto
          - android
          - flutter
          - webview
        default: auto

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install base tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl jq
          java -version
          python --version
          sdkmanager --version

      - name: Download source ZIP from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          release_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          asset_id="$(jq -r --arg name "${ASSET_NAME}" '.assets[] | select(.name == $name) | .id' <<<"${release_json}" | head -n 1)"
          if [[ -z "${asset_id}" || "${asset_id}" == "null" ]]; then
            echo "ERROR: Release asset not found: ${ASSET_NAME}" >&2
            exit 1
          fi

          mkdir -p source
          curl --fail-with-body --silent --show-error -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            -o "source/${ASSET_NAME}"

          unzip -t "source/${ASSET_NAME}"
          rm -rf extracted
          mkdir -p extracted
          unzip -qq "source/${ASSET_NAME}" -d extracted

      - name: Detect project
        id: detect
        shell: bash
        env:
          REQUESTED_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          root="$(find extracted -type f \( -name pubspec.yaml -o -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name AndroidManifest.xml \) -printf '%h\n' | sort -u | head -n 1 || true)"
          if [[ -z "${root}" ]]; then
            root="extracted"
          fi

          if [[ -f "${root}/pubspec.yaml" ]]; then
            detected="flutter"
          elif [[ -f "${root}/gradlew" || -f "${root}/settings.gradle" || -f "${root}/settings.gradle.kts" ]]; then
            if grep -Rqs --exclude-dir=.gradle --exclude-dir=build 'android.webkit.WebView' "${root}" 2>/dev/null; then
              detected="webview"
            else
              detected="android"
            fi
          else
            detected="unknown"
          fi

          case "${REQUESTED_BUILD_TYPE}" in
            auto) build_type="${detected}" ;;
            flutter|android|webview) build_type="${REQUESTED_BUILD_TYPE}" ;;
            *) echo "ERROR: unsupported build_type: ${REQUESTED_BUILD_TYPE}" >&2; exit 1 ;;
          esac

          if [[ "${build_type}" == "flutter" && ! -f "${root}/pubspec.yaml" ]]; then
            echo "ERROR: Flutter build requested but pubspec.yaml was not found." >&2
            exit 1
          fi

          if [[ "${build_type}" == "android" || "${build_type}" == "webview" ]]; then
            if [[ ! -f "${root}/gradlew" && ! -f "${root}/settings.gradle" && ! -f "${root}/settings.gradle.kts" ]]; then
              echo "ERROR: Android/WebView build requested but Gradle project files were not found." >&2
              exit 1
            fi
          fi

          echo "root=${root}" >> "$GITHUB_OUTPUT"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          printf 'Detected root: %s\nDetected build type: %s\n' "${root}" "${build_type}"

      - name: Install Flutter SDK
        if: steps.detect.outputs.build_type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_VERSION="stable"
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Build Flutter APK
        if: steps.detect.outputs.build_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release

      - name: Build Android APK
        if: steps.detect.outputs.build_type == 'android' || steps.detect.outputs.build_type == 'webview'
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./gradlew ]]; then
            ./gradlew assembleRelease
          else
            chmod +x ./gradlew 2>/dev/null || true
            ./gradlew assembleRelease
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find extracted -type f -iname '*.apk' -print | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "ERROR: APK_NOT_FOUND: no APK file was produced." >&2
            exit 1
          fi

          index=0
          for apk in "${apks[@]}"; do
            base="$(basename "${apk}")"
            target="artifacts/${base}"
            if [[ -e "${target}" ]]; then
              index=$((index + 1))
              target="artifacts/${index}-${base}"
            fi
            cp -f "${apk}" "${target}"
            printf '%s\n' "${target}"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ inputs.release_tag }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 1
