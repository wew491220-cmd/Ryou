name: Flutter APK Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      zip_url:
        description: "URL ZIP project Flutter"
        required: false
        type: string

      job_id:
        description: "Build ID"
        required: true
        type: string

      tag:
        description: "Temporary release tag"
        required: true
        type: string

      mode:
        description: "Build mode"
        required: false
        default: release
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    permissions:
      contents: read
      actions: read

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================
      # DOWNLOAD PROJECT ZIP
      # ==========================================
      - name: Download source ZIP
        env:
          SOURCE_URL: ${{ inputs.input_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p project

          echo "Downloading Flutter project..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: Ryouken-APK-Build-Bot" \
            "$SOURCE_URL" \
            -o /tmp/project.zip

          echo "Extracting project..."

          unzip -q /tmp/project.zip -d project

          rm -f /tmp/project.zip

          echo "Project extracted."

      # ==========================================
      # FIND FLUTTER PROJECT
      # ==========================================
      - name: Locate Flutter project
        run: |
          set -e

          PUB=$(find project \
            -name pubspec.yaml \
            -type f \
            -not -path "*/build/*" \
            | head -n1)

          if [ -z "$PUB" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUB")

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # SHOW VERSIONS
      # ==========================================
      - name: Show Flutter environment
        run: |
          flutter --version
          dart --version
          java -version
          echo "Project: $PROJECT_DIR"

      # ==========================================
      # FIX GRADLE WRAPPER
      # ==========================================
      - name: Fix Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          echo "Original Gradle configuration:"
          cat "$WRAPPER"

          # Flutter sekarang membutuhkan minimal Gradle 8.14
          sed -i \
            -E 's#gradle-[0-9]+(\.[0-9]+)*(-all|-bin)\.zip#gradle-8.14.0-all.zip#g' \
            "$WRAPPER"

          # Fallback kalau format URL berbeda
          sed -i \
            -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.0-all.zip#g' \
            "$WRAPPER"

          echo ""
          echo "Updated Gradle configuration:"
          cat "$WRAPPER"

      # ==========================================
      # PREPARE ANDROID
      # ==========================================
      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter clean || true

          rm -rf android/.gradle
          rm -rf build

          echo "Android project prepared."

      # ==========================================
      # GET DEPENDENCIES
      # ==========================================
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter pub get

      # ==========================================
      # ANALYZE PROJECT
      # ==========================================
      - name: Flutter dependency check
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          flutter analyze --suggestions || true

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Starting APK build..."

          flutter build apk \
            --release \
            --verbose

      # ==========================================
      # COLLECT APK
      # ==========================================
      - name: Collect APK
        run: |
          set -e

          mkdir -p output

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory tidak ditemukan."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} output/ \;

          if ! find output -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak berhasil dibuat."
            exit 1
          fi

          echo ""
          echo "APK hasil build:"
          ls -lh output/*.apk

      # ==========================================
      # UPLOAD APK ARTIFACT
      # ==========================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 1
