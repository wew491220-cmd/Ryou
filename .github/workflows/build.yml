name: Universal ZIP to APK (Genetik + Sign)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release GitHub tempat ZIP diupload"
        required: true
        type: string

      asset_name:
        description: "Nama file asset ZIP"
        required: true
        type: string

      build_type:
        description: "Jenis project"
        required: true
        type: choice
        options:
          - auto
          - android
          - flutter
          - webview
        default: auto

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04

    outputs:
      assets: ${{ steps.parse.outputs.assets }}

    steps:
      - name: Parse daftar asset ZIP
        id: parse
        shell: bash
        run: |
          set -euo pipefail

          RAW="${{ inputs.asset_name }}"

          ASSETS_JSON="$(printf '%s' "$RAW" \
            | tr ',' '\n' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          echo "Assets:"
          echo "$ASSETS_JSON"

          echo "assets=$ASSETS_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        asset: ${{ fromJson(needs.prepare.outputs.assets) }}

    steps:

      # ==========================================
      # CLEAN RUNNER
      # ==========================================

      - name: Bersihkan ruang disk runner
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk sebelum:"
          df -h /

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo docker image prune -af || true

          echo "Disk sesudah:"
          df -h /

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            platforms;android-34
            build-tools;35.0.0
            build-tools;34.0.0

      - name: Install Android SDK extras
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          for pkg in \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"
          do
            echo "Installing $pkg..."
            sdkmanager --install "$pkg" || \
              echo "::warning::Gagal install $pkg"
          done

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # SANITIZE NAME
      # ==========================================

      - name: Sanitize nama asset
        id: sanitize
        shell: bash
        run: |
          set -euo pipefail

          SAFE="$(printf '%s' "${{ matrix.asset }}" \
            | sed -E 's/\.[Zz][Ii][Pp]$//' \
            | sed -E 's/[^A-Za-z0-9._-]+/-/g')"

          echo "name=$SAFE" >> "$GITHUB_OUTPUT"

      # ==========================================
      # DOWNLOAD ZIP DARI RELEASE
      # ==========================================

      - name: Download ZIP dari Release
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          TAG="${{ inputs.release_tag }}"
          ASSET="${{ matrix.asset }}"

          echo "Release : $TAG"
          echo "Asset   : $ASSET"

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --clobber

          if [ ! -f "$ASSET" ]; then
            echo "::error::Asset $ASSET gagal didownload."
            exit 1
          fi

          echo "zip_path=$ASSET" >> "$GITHUB_OUTPUT"

      # ==========================================
      # EXTRACT
      # ==========================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p workspace

          ZIP="${{ steps.download.outputs.zip_path }}"

          unzip -q "$ZIP" -d workspace

          echo "Isi project:"
          find workspace -maxdepth 4 -type f | sort | head -300

      # ==========================================
      # DETECT PROJECT
      # ==========================================

      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ inputs.build_type }}"

          if [ "$REQUESTED" != "auto" ]; then
            echo "type=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Flutter
          if find workspace \
            -type f \
            -name "pubspec.yaml" \
            -print -quit | grep -q .
          then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Android Gradle
          if find workspace \
            -type f \
            -name "gradlew" \
            -print -quit | grep -q .
          then
            echo "type=android" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if find workspace \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit | grep -q .
          then
            echo "type=android" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Web
          if find workspace \
            -type f \
            -name "index.html" \
            -print -quit | grep -q .
          then
            echo "type=webview" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "type=unknown" >> "$GITHUB_OUTPUT"

      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find workspace \
            -type f \
            -name pubspec.yaml \
            -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "FLUTTER_PROJECT=$ROOT" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$ROOT"

      # ==========================================
      # GRADLE
      # ==========================================

      - name: Ensure compatible Gradle version
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "::error::$WRAPPER tidak ditemukan."
            exit 1
          fi

          echo "Gradle sebelum:"
          cat "$WRAPPER"

          sed -i -E \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.2-all.zip#' \
            "$WRAPPER"

          echo ""
          echo "Gradle sesudah:"
          cat "$WRAPPER"

      # ==========================================
      # AGP
      # ==========================================

      - name: Ensure compatible AGP version
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          AGP_VERSION="8.12.1"

          for FILE in \
            android/settings.gradle \
            android/settings.gradle.kts \
            android/build.gradle \
            android/build.gradle.kts
          do
            if [ -f "$FILE" ]; then

              echo "Checking $FILE"

              sed -i -E \
                "s#(com\.android\.application[\"']?\)?[[:space:]]*version[[:space:]]*[\"'])[0-9.]+([\"'])#\1${AGP_VERSION}\2#g" \
                "$FILE" || true

              sed -i -E \
                "s#(com\.android\.tools\.build:gradle:)[0-9.]+#\1${AGP_VERSION}#g" \
                "$FILE" || true

            fi
          done

      # ==========================================
      # FLUTTER PUB GET
      # ==========================================

      - name: Flutter Pub Get
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          flutter pub get

      # ==========================================
      # FLUTTER BUILD
      # ==========================================

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

          flutter build apk --release

      # ==========================================
      # ANDROID NATIVE
      # ==========================================

      - name: Locate Android project
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find workspace \
            -type f \
            -name gradlew \
            -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "::error::gradlew tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_PROJECT=$ROOT" >> "$GITHUB_ENV"

      - name: Build Android APK
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon

      # ==========================================
      # COLLECT APK
      # ==========================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          APK=""

          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then

            APK="$(find "${FLUTTER_PROJECT}/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" \
              -print -quit)"

          elif [ "${{ steps.detect.outputs.type }}" = "android" ]; then

            APK="$(find "${ANDROID_PROJECT}" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print -quit)"

          fi

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."

            echo "APK yang tersedia:"
            find workspace -type f -name "*.apk" -print || true

            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          cp "$APK" "output/app-release.apk"

          echo "Output:"
          ls -lh output/

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.sanitize.outputs.name }}
          path: output/app-release.apk
          if-no-files-found: error
          retention-days: 1

      # ==========================================
      # BUILD SUMMARY
      # ==========================================

      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "================================"
          echo " BUILD BERHASIL"
          echo "================================"
          echo "Project type : ${{ steps.detect.outputs.type }}"
          echo "Asset        : ${{ matrix.asset }}"
          echo "APK          : output/app-release.apk"
          ls -lh output/app-release.apk

      # ==========================================
      # ERROR INFO
      # ==========================================

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          echo "================================"
          echo " BUILD GAGAL"
          echo "================================"

          echo "Project type:"
          echo "${{ steps.detect.outputs.type }}"

          echo ""
          echo "APK yang ditemukan:"
          find workspace -type f -name "*.apk" -print || true

          echo ""
          echo "Gradle files:"
          find workspace \
            -path "*/gradle/wrapper/gradle-wrapper.properties" \
            -print || true
